server.port=8082
spring.application.name=quality-clearance-agent

# JSON file locations (inside src/main/resources/data/)
quality.data.production-orders=classpath:data/production_orders.json
quality.data.pdi-records=classpath:data/pdi_records.json
quality.data.pdo-records=classpath:data/pdo_records.json

# Ollama configuration
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
ollama.temperature=0.2
ollama.max-tokens=800